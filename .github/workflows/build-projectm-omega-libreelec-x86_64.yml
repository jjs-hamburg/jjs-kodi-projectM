name: Build projectM Omega LibreELEC x86_64

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-projectm-omega-libreelec-x86_64.yml"
      - "patch/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-projectm-omega-libreelec-x86_64.yml"
      - "patch/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      LIBREELEC_REF: f3fdd11916f8a47dc5a11c3a4c99cb7c7ffac78b
      ADDON_REF: d91f39d9ee9f06f998fe83d58154d36331d2c666
      PROJECTM_REF: b3c3282eb00fae210e9499fa9d11bcfcccffbd96
      ADDON_VERSION: 21.0.3.3
      LE_ADDON_ZIP: visualization.projectm-21.0.3.3-omega-libreelec-x86_64.zip
      LE_SOURCE_ZIP: jjs-kodi-projectm-21.0.3.3-libreelec-x86_64-source.zip

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Checkout LibreELEC 12.0.2
        uses: actions/checkout@v5
        with:
          repository: LibreELEC/LibreELEC.tv
          ref: 12.0.2
          path: LibreELEC.tv
          fetch-depth: 1

      - name: Checkout pinned visualization.projectm Omega source
        uses: actions/checkout@v5
        with:
          repository: xbmc/visualization.projectm
          ref: ${{ env.ADDON_REF }}
          path: visualization.projectm
          fetch-depth: 1

      - name: Checkout pinned projectM 3.1.12 source
        uses: actions/checkout@v5
        with:
          repository: projectM-visualizer/projectm
          ref: ${{ env.PROJECTM_REF }}
          path: projectM-3.1.12
          fetch-depth: 1
          submodules: recursive

      - name: Verify exact source revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C LibreELEC.tv rev-parse HEAD)" = "$LIBREELEC_REF"
          test "$(git -C visualization.projectm rev-parse HEAD)" = "$ADDON_REF"
          test "$(git -C projectM-3.1.12 rev-parse HEAD)" = "$PROJECTM_REF"
          grep -F 'PKG_VERSION="21.0.3-Omega"' LibreELEC.tv/packages/mediacenter/kodi-binary-addons/visualization.projectm/package.mk
          grep -F 'PKG_VERSION="3.1.12"' LibreELEC.tv/packages/graphics/libprojectM/package.mk

      - name: Apply shared JJS audio-isolation transformation
        shell: bash
        run: |
          set -euo pipefail
          python3 patch/apply_changes.py \
            --addon "$GITHUB_WORKSPACE/visualization.projectm" \
            --projectm "$GITHUB_WORKSPACE/projectM-3.1.12"
          grep -F 'std::try_to_lock' visualization.projectm/src/Main.cpp
          grep -F 'version="21.0.3.3"' visualization.projectm/visualization.projectm/addon.xml.in
          grep -F 'name="JJS KODI projectM"' visualization.projectm/visualization.projectm/addon.xml.in

      - name: Prepare exact JJS source archive for LibreELEC package build
        shell: bash
        run: |
          set -euo pipefail
          rm -rf le-source-root
          mkdir -p "le-source-root/visualization.projectm-${ADDON_VERSION}"
          cp -a visualization.projectm/. "le-source-root/visualization.projectm-${ADDON_VERSION}/"
          find "le-source-root/visualization.projectm-${ADDON_VERSION}" -type d -name .git -prune -exec rm -rf {} +
          find "le-source-root/visualization.projectm-${ADDON_VERSION}" -type f -name .git -delete

          mkdir -p localdist
          archive="localdist/visualization.projectm-${ADDON_VERSION}.tar.gz"
          tar -C le-source-root -czf "$archive" "visualization.projectm-${ADDON_VERSION}"
          sha256sum "$archive"
          echo "LE_SOURCE_ARCHIVE=$GITHUB_WORKSPACE/$archive" >> "$GITHUB_ENV"
          echo "LE_SOURCE_SHA256=$(sha256sum "$archive" | awk '{print $1}')" >> "$GITHUB_ENV"

      - name: Point LibreELEC package recipe at exact transformed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path("LibreELEC.tv/packages/mediacenter/kodi-binary-addons/visualization.projectm/package.mk")
          s = p.read_text(encoding="utf-8")

          replacements = [
              ('PKG_VERSION="21.0.3-Omega"', 'PKG_VERSION="21.0.3.3"'),
              ('PKG_SHA256="aee6c038a48c68868edb1178e9ae980b1082de82db2e4b36c6b99c65ec5e88ca"',
               f'PKG_SHA256="{os.environ["LE_SOURCE_SHA256"]}"'),
              ('PKG_URL="https://github.com/xbmc/visualization.projectm/archive/${PKG_VERSION}.tar.gz"',
               'PKG_SOURCE_NAME="visualization.projectm-${PKG_VERSION}.tar.gz"\nPKG_URL="file://${SOURCES}/${PKG_NAME}/${PKG_SOURCE_NAME}"'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one LibreELEC package recipe match: {old!r}")
              s = s.replace(old, new, 1)

          p.write_text(s, encoding="utf-8")
          PY
          cat LibreELEC.tv/packages/mediacenter/kodi-binary-addons/visualization.projectm/package.mk

      - name: Install LibreELEC host build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            bc build-essential curl g++ gcc git gperf make openjdk-11-jre-headless \
            rsync unzip wget xfonts-utils xsltproc xz-utils zip

      - name: Cache LibreELEC downloads and compiler cache
        uses: actions/cache@v4
        with:
          path: |
            LibreELEC.tv/sources
            LibreELEC.tv/build.LibreELEC-Generic.x86_64-12.0.2/.ccache
          key: libreelec-12.0.2-generic-x86_64-projectm-${{ env.ADDON_REF }}-${{ env.PROJECTM_REF }}
          restore-keys: |
            libreelec-12.0.2-generic-x86_64-projectm-

      - name: Restore exact local visualization source after cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p LibreELEC.tv/sources/visualization.projectm
          cp "$LE_SOURCE_ARCHIVE" "LibreELEC.tv/sources/visualization.projectm/visualization.projectm-${ADDON_VERSION}.tar.gz"
          test "$(sha256sum "LibreELEC.tv/sources/visualization.projectm/visualization.projectm-${ADDON_VERSION}.tar.gz" | awk '{print $1}')" = "$LE_SOURCE_SHA256"

      - name: Build LibreELEC Generic x86_64 visualization.projectm
        working-directory: LibreELEC.tv
        shell: bash
        env:
          PROJECT: Generic
          DEVICE: Generic
          ARCH: x86_64
          MTPROGRESS: "no"
        run: |
          set -euo pipefail
          scripts/create_addon visualization.projectm

      - name: Locate and normalize LibreELEC add-on ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out le-package
          mapfile -t zips < <(find LibreELEC.tv/target -type f -name 'visualization.projectm-*.zip' | sort)
          printf 'LibreELEC add-on ZIP candidates:\n'
          printf '%s\n' "${zips[@]}"
          test "${#zips[@]}" -gt 0

          unzip -q "${zips[0]}" -d le-package
          test -f le-package/visualization.projectm/addon.xml

          cp LICENSE.md le-package/visualization.projectm/LICENSE.md
          cp LICENSE-projectM-LGPL-2.1.txt le-package/visualization.projectm/LICENSE-projectM-LGPL-2.1.txt
          cp NOTICE.md le-package/visualization.projectm/NOTICE.md
          cp SOURCE.md le-package/visualization.projectm/SOURCE.md

          (cd le-package && zip -qr "../out/$LE_ADDON_ZIP" visualization.projectm)
          sha256sum "out/$LE_ADDON_ZIP" | tee out/SHA256SUMS-libreelec-x86_64.txt

      - name: Validate LibreELEC package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf le-validate
          mkdir le-validate
          unzip -q "out/$LE_ADDON_ZIP" -d le-validate

          addon="le-validate/visualization.projectm/addon.xml"
          test -f "$addon"
          grep -F 'version="21.0.3.3"' "$addon"
          grep -F 'name="JJS KODI projectM"' "$addon"
          grep -F 'provider-name="Team Kodi; JJS"' "$addon"
          grep -F '<platform>linux</platform>' "$addon"
          grep -F 'library_linux=' "$addon"

          mapfile -t libs < <(find le-validate/visualization.projectm -type f -name '*.so' | sort)
          printf 'LibreELEC binary candidates:\n'
          printf '%s\n' "${libs[@]}"
          test "${#libs[@]}" -gt 0
          file "${libs[0]}" | grep -E 'ELF 64-bit.*x86-64'
          readelf -h "${libs[0]}" | grep -F 'Advanced Micro Devices X86-64'
          grep -F 'std::try_to_lock' visualization.projectm/src/Main.cpp

          test -s le-validate/visualization.projectm/LICENSE.md
          test -s le-validate/visualization.projectm/LICENSE-projectM-LGPL-2.1.txt
          test -s le-validate/visualization.projectm/NOTICE.md
          test -s le-validate/visualization.projectm/SOURCE.md

      - name: Package LibreELEC corresponding source and build recipe
        shell: bash
        run: |
          set -euo pipefail
          rm -rf le-corresponding-source
          root="le-corresponding-source/jjs-kodi-projectm-${ADDON_VERSION}-libreelec-x86_64"
          mkdir -p "$root/build"

          cp -a visualization.projectm "$root/visualization.projectm"
          cp -a projectM-3.1.12 "$root/projectM-3.1.12"
          find "$root" -type d -name .git -prune -exec rm -rf {} +
          find "$root" -type f -name .git -delete

          cp patch/apply_changes.py "$root/build/apply_changes.py"
          cp .github/workflows/build-projectm-omega-libreelec-x86_64.yml "$root/build/"
          cp LibreELEC.tv/packages/mediacenter/kodi-binary-addons/visualization.projectm/package.mk "$root/build/libreelec-visualization.projectm-package.mk"
          cp README.md NOTICE.md SOURCE.md LICENSE.md LICENSE-projectM-LGPL-2.1.txt "$root/"

          (cd le-corresponding-source && zip -qr "../out/$LE_SOURCE_ZIP" "jjs-kodi-projectm-${ADDON_VERSION}-libreelec-x86_64")
          sha256sum "out/$LE_SOURCE_ZIP" >> out/SHA256SUMS-libreelec-x86_64.txt

      - name: Validate LibreELEC corresponding source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf le-source-validate
          mkdir le-source-validate
          unzip -q "out/$LE_SOURCE_ZIP" -d le-source-validate
          root="le-source-validate/jjs-kodi-projectm-${ADDON_VERSION}-libreelec-x86_64"
          test -s "$root/visualization.projectm/src/Main.cpp"
          grep -F 'std::try_to_lock' "$root/visualization.projectm/src/Main.cpp"
          test -s "$root/projectM-3.1.12/src/libprojectM/projectM.cpp"
          test -s "$root/build/build-projectm-omega-libreelec-x86_64.yml"
          test -s "$root/build/libreelec-visualization.projectm-package.mk"

      - name: Publish LibreELEC files to existing JJS release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${ADDON_VERSION}-jjs"
          gh release view "$tag" >/dev/null
          gh release upload "$tag" \
            "out/$LE_ADDON_ZIP" \
            "out/$LE_SOURCE_ZIP" \
            out/SHA256SUMS-libreelec-x86_64.txt \
            --clobber
