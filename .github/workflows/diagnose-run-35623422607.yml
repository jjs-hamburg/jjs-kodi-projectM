name: Diagnose LibreELEC run 35623422607

on:
  push:
    branches:
      - feature/libreelec-x86_64
    paths:
      - ".github/workflows/diagnose-run-35623422607.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Extract first real failure from existing job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "106411793228"
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/job-${JOB_ID}.log"
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o "$log"

          echo "Downloaded log bytes: $(wc -c < "$log")"

          python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()

          patterns = [
              re.compile(r"\[FAIL\]"),
              re.compile(r"FAILURE \[build"),
              re.compile(r"\*\*\* FAILED COMMAND \*\*\*"),
          ]

          hits = []
          for i, line in enumerate(lines):
              if any(p.search(line) for p in patterns):
                  hits.append(i)

          if not hits:
              print("NO FAILURE MARKER FOUND")
              sys.exit(1)

          first = hits[0]
          print(f"FIRST FAILURE MARKER LINE: {first + 1}")
          print("===== CONTEXT =====")
          start = max(0, first - 120)
          end = min(len(lines), first + 220)
          for n in range(start, end):
              print(f"{n + 1}: {lines[n]}")
          print("===== FIRST 40 FAILURE MARKERS =====")
          for i in hits[:40]:
              print(f"{i + 1}: {lines[i]}")
          PY
