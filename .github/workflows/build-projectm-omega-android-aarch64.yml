name: Build projectM Omega Android AArch64

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/build-projectm-omega-android-aarch64.yml"
      - "patch/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-projectm-omega-android-aarch64.yml"
      - "patch/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      KODI_REF: f8815ee40f49a700c047982d752be4b2a61420e2
      ADDON_REF: d91f39d9ee9f06f998fe83d58154d36331d2c666
      PROJECTM_REF: b3c3282eb00fae210e9499fa9d11bcfcccffbd96
      ADDON_VERSION: 21.0.3.3
      ADDON_ZIP: visualization.projectm-21.0.3.3-omega-android-aarch64.zip
      SOURCE_ZIP: jjs-kodi-projectm-21.0.3.3-source.zip
      NDK_VERSION: 21.4.7075529
      ANDROID_API: 21
      PREFIX: ${{ github.workspace }}/xbmc-depends
      TARBALLS: ${{ github.workspace }}/xbmc-tarballs
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v5

      - name: Validate source transformer
        shell: bash
        run: |
          set -euo pipefail
          test -s patch/apply_changes.py
          python3 -m py_compile patch/apply_changes.py
          sha256sum patch/apply_changes.py

      - name: Checkout pinned Kodi Omega source
        uses: actions/checkout@v5
        with:
          repository: xbmc/xbmc
          ref: ${{ env.KODI_REF }}
          path: kodi
          fetch-depth: 1

      - name: Checkout pinned visualization.projectm Omega source
        uses: actions/checkout@v5
        with:
          repository: xbmc/visualization.projectm
          ref: ${{ env.ADDON_REF }}
          path: visualization.projectm
          fetch-depth: 1

      - name: Checkout pinned projectM 3.1.12 source
        uses: actions/checkout@v5
        with:
          repository: projectM-visualizer/projectm
          ref: ${{ env.PROJECTM_REF }}
          path: projectM-3.1.12
          fetch-depth: 1
          submodules: recursive

      - name: Verify exact upstream revisions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C kodi rev-parse HEAD)" = "$KODI_REF"
          test "$(git -C visualization.projectm rev-parse HEAD)" = "$ADDON_REF"
          test "$(git -C projectM-3.1.12 rev-parse HEAD)" = "$PROJECTM_REF"
          grep -F 'version="21.0.3"' visualization.projectm/visualization.projectm/addon.xml.in
          grep -F 'projectM-3.1.12.tar.gz' visualization.projectm/depends/common/projectm/projectm.txt
          test -f projectM-3.1.12/src/libprojectM/projectM.cpp
          test -f projectM-3.1.12/src/libprojectM/projectM.hpp

      - name: Restore Kodi source tarball cache
        id: tarball-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TARBALLS }}
          key: kodi-tarballs-${{ runner.os }}-${{ runner.arch }}-${{ env.KODI_REF }}
          restore-keys: |
            kodi-tarballs-${{ runner.os }}-${{ runner.arch }}-

      - name: Apply audio-isolation stability source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 patch/apply_changes.py \
            --addon "$GITHUB_WORKSPACE/visualization.projectm" \
            --projectm "$GITHUB_WORKSPACE/projectM-3.1.12"

      - name: Create local projectM dependency archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/localdist"
          tar -C "$GITHUB_WORKSPACE" -czf "$GITHUB_WORKSPACE/localdist/projectM-3.1.12.tar.gz" projectM-3.1.12
          printf 'projectm file://%s/localdist/projectM-3.1.12.tar.gz\n' "$GITHUB_WORKSPACE" > visualization.projectm/depends/common/projectm/projectm.txt
          sha256sum "$GITHUB_WORKSPACE/localdist/projectM-3.1.12.tar.gz" | awk '{print $1}' > visualization.projectm/depends/common/projectm/projectm.sha256

      - name: Install host build requirements
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential curl default-jdk flex gawk git gperf \
            lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev libtool pkg-config \
            python3 unzip zip zlib1g-dev

      - name: Install Android NDK r21e
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;${NDK_VERSION}"
          test -d "/usr/local/lib/android/sdk/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore completed Kodi Android dependency environment
        id: depends-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/kodi/tools/depends/Makefile.include
          key: kodi-depends-${{ runner.os }}-${{ runner.arch }}-${{ env.KODI_REF }}-aarch64-api${{ env.ANDROID_API }}-ndk${{ env.NDK_VERSION }}

      - name: Preseed verified fontconfig 2.14.0 archive
        if: steps.depends-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TARBALLS"

          archive="fontconfig-2.14.0.tar.xz"
          version_file="$GITHUB_WORKSPACE/kodi/tools/depends/target/fontconfig/FONTCONFIG-VERSION"
          expected="$(sed -n 's/^SHA512=//p' "$version_file")"
          test -n "$expected"

          verify_archive() {
            [ -f "$1" ] || return 1
            actual="$(sha512sum "$1" | awk '{print $1}')"
            [ "$actual" = "$expected" ]
          }

          if verify_archive "$TARBALLS/$archive"; then
            echo "Using verified cached $archive"
            exit 0
          fi

          rm -f "$TARBALLS/$archive" "$TARBALLS/$archive.tmp"

          urls=(
            "https://gstreamer.freedesktop.org/data/src/mirror/$archive"
            "https://mirrors.mit.edu/macports/distfiles/fontconfig/$archive"
          )

          for url in "${urls[@]}"; do
            echo "Downloading $archive from $url"
            if curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
              --output "$TARBALLS/$archive.tmp" "$url"; then
              if verify_archive "$TARBALLS/$archive.tmp"; then
                mv "$TARBALLS/$archive.tmp" "$TARBALLS/$archive"
                echo "Verified $archive against pinned Kodi SHA512: $expected"
                exit 0
              fi
              echo "Downloaded archive from $url failed Kodi SHA512 verification" >&2
            fi
            rm -f "$TARBALLS/$archive.tmp"
          done

          echo "Unable to obtain a fontconfig archive matching the pinned Kodi SHA512" >&2
          exit 1

      - name: Configure Kodi Android AArch64 depends
        working-directory: kodi/tools/depends
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap
          ./configure \
            --host=aarch64-linux-android \
            --with-sdk-path="$ANDROID_SDK_ROOT" \
            --with-ndk-path="$ANDROID_NDK_HOME" \
            --with-ndk-api="$ANDROID_API" \
            --with-tarballs="$TARBALLS" \
            --prefix="$PREFIX" \
            --enable-debug=no

      - name: Build Kodi Android dependency environment
        if: steps.depends-cache.outputs.cache-hit != 'true'
        working-directory: kodi/tools/depends
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Save Kodi source tarball cache
        if: steps.tarball-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TARBALLS }}
          key: kodi-tarballs-${{ runner.os }}-${{ runner.arch }}-${{ env.KODI_REF }}

      - name: Save completed Kodi Android dependency environment
        if: steps.depends-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/kodi/tools/depends/Makefile.include
          key: kodi-depends-${{ runner.os }}-${{ runner.arch }}-${{ env.KODI_REF }}-aarch64-api${{ env.ANDROID_API }}-ndk${{ env.NDK_VERSION }}

      - name: Build visualization.projectm only
        working-directory: kodi
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(getconf _NPROCESSORS_ONLN)" -C tools/depends/target/binary-addons \
            ADDONS="visualization.projectm" \
            ADDON_SRC_PREFIX="$GITHUB_WORKSPACE"

      - name: Locate built addon binary
        id: built
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t libs < <(find "$PREFIX" "$GITHUB_WORKSPACE/kodi" "$GITHUB_WORKSPACE/visualization.projectm" \
            -type f \( -name 'libvisualization.projectm.so' -o -name 'visualization.projectm.so' \) 2>/dev/null | sort -u)
          printf 'Found binary candidates:\n'
          printf '%s\n' "${libs[@]}"
          test "${#libs[@]}" -gt 0
          chosen="${libs[0]}"
          for f in "${libs[@]}"; do
            case "$f" in
              "$PREFIX"/*) chosen="$f"; break ;;
            esac
          done
          echo "lib=$chosen" >> "$GITHUB_OUTPUT"
          file "$chosen"
          readelf -h "$chosen" | grep -E 'Class:|Machine:'
          readelf -d "$chosen" | grep NEEDED || true

      - name: Package installable addon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out package-root
          mkdir -p out package-root/visualization.projectm

          addon_dir=""
          while IFS= read -r candidate; do
            d="$(dirname "$candidate")"
            if [ -d "$d/resources" ]; then
              addon_dir="$d"
              break
            fi
          done < <(find "$PREFIX" "$GITHUB_WORKSPACE/kodi" -type f -path '*/visualization.projectm/addon.xml' 2>/dev/null)

          if [ -n "$addon_dir" ]; then
            cp -a "$addon_dir"/. package-root/visualization.projectm/
          else
            cp -a visualization.projectm/visualization.projectm/resources package-root/visualization.projectm/
            generated_xml="$(find "$GITHUB_WORKSPACE" -type f -path '*/visualization.projectm/addon.xml' 2>/dev/null | head -n1 || true)"
            test -n "$generated_xml"
            cp "$generated_xml" package-root/visualization.projectm/addon.xml
          fi

          cp "${{ steps.built.outputs.lib }}" package-root/visualization.projectm/libvisualization.projectm.so
          cp LICENSE.md package-root/visualization.projectm/LICENSE.md
          cp LICENSE-projectM-LGPL-2.1.txt package-root/visualization.projectm/LICENSE-projectM-LGPL-2.1.txt
          cp NOTICE.md package-root/visualization.projectm/NOTICE.md
          cp SOURCE.md package-root/visualization.projectm/SOURCE.md

          python3 - <<'PY'
          from pathlib import Path
          p = Path("package-root/visualization.projectm/addon.xml")
          s = p.read_text(encoding="utf-8-sig")
          if 'version="21.0.3.3"' not in s:
              s = s.replace('version="21.0.3"', 'version="21.0.3.3"', 1)
          if 'version="21.0.3.3"' not in s:
              raise SystemExit("Expected addon version not found")
          p.write_text(s, encoding="utf-8")
          PY

          (cd package-root && zip -qr "../out/$ADDON_ZIP" visualization.projectm)
          sha256sum "out/$ADDON_ZIP" | tee out/SHA256SUMS.txt

      - name: Validate packaged addon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf validate
          mkdir validate
          unzip -q "out/$ADDON_ZIP" -d validate
          test -f validate/visualization.projectm/addon.xml
          test -f validate/visualization.projectm/libvisualization.projectm.so
          grep -F 'version="21.0.3.3"' validate/visualization.projectm/addon.xml
          grep -F 'name="JJS KODI projectM"' validate/visualization.projectm/addon.xml
          grep -F 'provider-name="Team Kodi; JJS"' validate/visualization.projectm/addon.xml
          grep -F '<source>https://github.com/jjs-hamburg/projectm-omega-build</source>' validate/visualization.projectm/addon.xml
          grep -F '<platform>android-aarch64</platform>' validate/visualization.projectm/addon.xml
          test -s validate/visualization.projectm/LICENSE.md
          test -s validate/visualization.projectm/LICENSE-projectM-LGPL-2.1.txt
          test -s validate/visualization.projectm/NOTICE.md
          test -s validate/visualization.projectm/SOURCE.md
          file validate/visualization.projectm/libvisualization.projectm.so
          readelf -h validate/visualization.projectm/libvisualization.projectm.so | grep -E 'Class:|Machine:'
          readelf -d validate/visualization.projectm/libvisualization.projectm.so | grep 'libGLESv2.so'

      - name: Package corresponding source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-root
          mkdir -p "source-root/jjs-kodi-projectm-${ADDON_VERSION}"

          cp -a visualization.projectm "source-root/jjs-kodi-projectm-${ADDON_VERSION}/visualization.projectm"
          cp -a projectM-3.1.12 "source-root/jjs-kodi-projectm-${ADDON_VERSION}/projectM-3.1.12"

          find "source-root/jjs-kodi-projectm-${ADDON_VERSION}" -type d -name .git -prune -exec rm -rf {} +
          find "source-root/jjs-kodi-projectm-${ADDON_VERSION}" -type f -name .git -delete

          mkdir -p "source-root/jjs-kodi-projectm-${ADDON_VERSION}/build"
          cp patch/apply_changes.py "source-root/jjs-kodi-projectm-${ADDON_VERSION}/build/apply_changes.py"
          cp .github/workflows/build-projectm-omega-android-aarch64.yml \
            "source-root/jjs-kodi-projectm-${ADDON_VERSION}/build/build-projectm-omega-android-aarch64.yml"
          cp README.md NOTICE.md SOURCE.md LICENSE.md LICENSE-projectM-LGPL-2.1.txt \
            "source-root/jjs-kodi-projectm-${ADDON_VERSION}/"

          (cd source-root && zip -qr "../out/$SOURCE_ZIP" "jjs-kodi-projectm-${ADDON_VERSION}")
          sha256sum "out/$SOURCE_ZIP" >> out/SHA256SUMS.txt

      - name: Validate corresponding source package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-validate
          mkdir source-validate
          unzip -q "out/$SOURCE_ZIP" -d source-validate
          root="source-validate/jjs-kodi-projectm-${ADDON_VERSION}"
          test -s "$root/visualization.projectm/src/Main.cpp"
          test -s "$root/visualization.projectm/visualization.projectm/addon.xml.in"
          grep -F 'std::try_to_lock' "$root/visualization.projectm/src/Main.cpp"
          grep -F 'name="JJS KODI projectM"' "$root/visualization.projectm/visualization.projectm/addon.xml.in"
          test -s "$root/projectM-3.1.12/src/libprojectM/projectM.cpp"
          test -s "$root/build/apply_changes.py"
          test -s "$root/LICENSE.md"
          test -s "$root/LICENSE-projectM-LGPL-2.1.txt"
          test -s "$root/NOTICE.md"
          test -s "$root/SOURCE.md"

      - name: Publish direct-install GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v${ADDON_VERSION}-jjs"
          title="JJS KODI projectM ${ADDON_VERSION} — Omega Android AArch64"
          notes="JJS KODI projectM stability build for Kodi 21/Omega on Android AArch64. Add-on ID remains visualization.projectm. The Kodi audio callback uses a non-blocking projectM mutex acquisition so preset changes cannot stall audio. Built from pinned upstream revisions documented in README.md."

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "out/$ADDON_ZIP" "out/$SOURCE_ZIP" out/SHA256SUMS.txt --clobber
          else
            gh release create "$tag" "out/$ADDON_ZIP" "out/$SOURCE_ZIP" out/SHA256SUMS.txt \
              --title "$title" \
              --notes "$notes"
          fi
