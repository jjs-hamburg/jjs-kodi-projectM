name: Build projectM Omega Android AArch64

on:
  workflow_dispatch:
  push:
    branches:
      - jjs-async-transition

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    env:
      KODI_BRANCH: Omega
      ADDON_BRANCH: Omega
      NDK_VERSION: 21.4.7075529
      ANDROID_API: 21
      PREFIX: ${{ github.workspace }}/xbmc-depends
      TARBALLS: ${{ github.workspace }}/xbmc-tarballs
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout build repository
        uses: actions/checkout@v4

      - name: Reassemble and verify source transformer
        shell: bash
        run: |
          set -euo pipefail
          cat patch/part00 patch/part01 patch/part02 patch/part03 patch/part04 > patch/apply_changes.py
          echo "c8b346d5b023ee177cf7f0a3d4ac6a70475256c03676d56aaa1013559e602ca5  patch/apply_changes.py" | sha256sum -c -
          python3 -m py_compile patch/apply_changes.py

      - name: Checkout Kodi Omega
        uses: actions/checkout@v4
        with:
          repository: xbmc/xbmc
          ref: ${{ env.KODI_BRANCH }}
          path: kodi
          fetch-depth: 1

      - name: Checkout visualization.projectm Omega
        uses: actions/checkout@v4
        with:
          repository: xbmc/visualization.projectm
          ref: ${{ env.ADDON_BRANCH }}
          path: visualization.projectm
          fetch-depth: 1

      - name: Checkout projectM 3.1.12
        uses: actions/checkout@v4
        with:
          repository: projectM-visualizer/projectm
          ref: v3.1.12
          path: projectM-3.1.12
          fetch-depth: 1
          submodules: recursive

      - name: Verify exact upstream versions
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'version="21.0.3"' visualization.projectm/visualization.projectm/addon.xml.in
          grep -F 'projectM-3.1.12.tar.gz' visualization.projectm/depends/common/projectm/projectm.txt
          test -f projectM-3.1.12/src/libprojectM/projectM.cpp
          test -f projectM-3.1.12/src/libprojectM/projectM.hpp

      - name: Capture Kodi revision
        id: kodi-revision
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git -C kodi rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Restore Kodi source tarball cache
        id: tarball-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.TARBALLS }}
          key: kodi-tarballs-${{ runner.os }}-${{ runner.arch }}-${{ steps.kodi-revision.outputs.sha }}
          restore-keys: |
            kodi-tarballs-${{ runner.os }}-${{ runner.arch }}-

      - name: Apply audio-isolation stability source changes
        run: |
          python3 patch/apply_changes.py             --addon "$GITHUB_WORKSPACE/visualization.projectm"             --projectm "$GITHUB_WORKSPACE/projectM-3.1.12"

      - name: Create local projectM dependency archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/localdist"
          tar -C "$GITHUB_WORKSPACE" -czf "$GITHUB_WORKSPACE/localdist/projectM-3.1.12.tar.gz" projectM-3.1.12
          printf 'projectm file://%s/localdist/projectM-3.1.12.tar.gz\n' "$GITHUB_WORKSPACE" > visualization.projectm/depends/common/projectm/projectm.txt
          sha256sum "$GITHUB_WORKSPACE/localdist/projectM-3.1.12.tar.gz" | awk '{print $1}' > visualization.projectm/depends/common/projectm/projectm.sha256
          echo "projectm.txt:"
          cat visualization.projectm/depends/common/projectm/projectm.txt
          echo "projectm.sha256:"
          cat visualization.projectm/depends/common/projectm/projectm.sha256

      - name: Install host build requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y             autoconf automake bison build-essential curl default-jdk flex gawk git gperf             lib32stdc++6 lib32z1 lib32z1-dev libcurl4-openssl-dev libtool pkg-config             python3 unzip zip zlib1g-dev

      - name: Install Android NDK r21e
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "ndk;${NDK_VERSION}"
          test -d "/usr/local/lib/android/sdk/ndk/${NDK_VERSION}"
          echo "ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore completed Kodi Android dependency environment
        id: depends-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/kodi/tools/depends/Makefile.include
          key: kodi-depends-${{ runner.os }}-${{ runner.arch }}-${{ steps.kodi-revision.outputs.sha }}-aarch64-api${{ env.ANDROID_API }}-ndk${{ env.NDK_VERSION }}

      - name: Preseed verified fontconfig 2.14.0 archive
        if: steps.depends-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TARBALLS"

          archive="fontconfig-2.14.0.tar.xz"
          version_file="$GITHUB_WORKSPACE/kodi/tools/depends/target/fontconfig/FONTCONFIG-VERSION"
          expected="$(sed -n 's/^SHA512=//p' "$version_file")"
          test -n "$expected"

          verify_archive() {
            [ -f "$1" ] || return 1
            actual="$(sha512sum "$1" | awk '{print $1}')"
            [ "$actual" = "$expected" ]
          }

          if verify_archive "$TARBALLS/$archive"; then
            echo "Using verified cached $archive"
            exit 0
          fi

          rm -f "$TARBALLS/$archive" "$TARBALLS/$archive.tmp"

          urls=(
            "https://gstreamer.freedesktop.org/data/src/mirror/$archive"
            "https://mirrors.mit.edu/macports/distfiles/fontconfig/$archive"
          )

          for url in "${urls[@]}"; do
            echo "Downloading $archive from $url"
            if curl --fail --location --retry 5 --retry-all-errors --connect-timeout 30 \
              --output "$TARBALLS/$archive.tmp" "$url"; then
              if verify_archive "$TARBALLS/$archive.tmp"; then
                mv "$TARBALLS/$archive.tmp" "$TARBALLS/$archive"
                echo "Verified $archive against Kodi Omega SHA512: $expected"
                exit 0
              fi
              echo "Downloaded archive from $url failed Kodi SHA512 verification" >&2
            fi
            rm -f "$TARBALLS/$archive.tmp"
          done

          echo "Unable to obtain a fontconfig archive matching Kodi Omega SHA512" >&2
          exit 1

      - name: Configure Kodi Android AArch64 depends
        # Always rerun configure on the fresh Kodi checkout. The cache contains
        # the built PREFIX, but configure regenerates source-tree files such as
        # target/Toolchain_binaddons.cmake that binary-addons make depends on.
        working-directory: kodi/tools/depends
        shell: bash
        run: |
          set -euo pipefail
          ./bootstrap
          ./configure             --host=aarch64-linux-android             --with-sdk-path="$ANDROID_SDK_ROOT"             --with-ndk-path="$ANDROID_NDK_HOME"             --with-ndk-api="$ANDROID_API"             --with-tarballs="$TARBALLS"             --prefix="$PREFIX"             --enable-debug=no

      - name: Build Kodi Android dependency environment
        if: steps.depends-cache.outputs.cache-hit != 'true'
        working-directory: kodi/tools/depends
        run: make -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Save Kodi source tarball cache
        if: steps.tarball-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TARBALLS }}
          key: kodi-tarballs-${{ runner.os }}-${{ runner.arch }}-${{ steps.kodi-revision.outputs.sha }}

      - name: Save completed Kodi Android dependency environment
        if: steps.depends-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.PREFIX }}
            ${{ github.workspace }}/kodi/tools/depends/Makefile.include
          key: kodi-depends-${{ runner.os }}-${{ runner.arch }}-${{ steps.kodi-revision.outputs.sha }}-aarch64-api${{ env.ANDROID_API }}-ndk${{ env.NDK_VERSION }}

      - name: Build visualization.projectm only
        working-directory: kodi
        shell: bash
        run: |
          set -euo pipefail
          make -j"$(getconf _NPROCESSORS_ONLN)" -C tools/depends/target/binary-addons             ADDONS="visualization.projectm"             ADDON_SRC_PREFIX="$GITHUB_WORKSPACE"

      - name: Locate built addon binary
        id: built
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t libs < <(find "$PREFIX" "$GITHUB_WORKSPACE/kodi" "$GITHUB_WORKSPACE/visualization.projectm"             -type f \( -name 'libvisualization.projectm.so' -o -name 'visualization.projectm.so' \) 2>/dev/null | sort -u)
          printf 'Found binary candidates:\n'
          printf '%s\n' "${libs[@]}"
          test "${#libs[@]}" -gt 0
          chosen="${libs[0]}"
          for f in "${libs[@]}"; do
            case "$f" in
              "$PREFIX"/*) chosen="$f"; break ;;
            esac
          done
          echo "lib=$chosen" >> "$GITHUB_OUTPUT"
          file "$chosen"
          readelf -h "$chosen" | grep -E 'Class:|Machine:'
          readelf -d "$chosen" | grep NEEDED || true

      - name: Package installable addon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out package-root
          mkdir -p out package-root/visualization.projectm

          addon_dir=""
          while IFS= read -r candidate; do
            d="$(dirname "$candidate")"
            if [ -d "$d/resources" ]; then
              addon_dir="$d"
              break
            fi
          done < <(find "$PREFIX" "$GITHUB_WORKSPACE/kodi" -type f -path '*/visualization.projectm/addon.xml' 2>/dev/null)

          if [ -n "$addon_dir" ]; then
            cp -a "$addon_dir"/. package-root/visualization.projectm/
          else
            # Fallback: use upstream resource tree and create addon.xml from the generated build tree if available.
            cp -a visualization.projectm/visualization.projectm/resources package-root/visualization.projectm/
            generated_xml="$(find "$GITHUB_WORKSPACE" -type f -path '*/visualization.projectm/addon.xml' 2>/dev/null | head -n1 || true)"
            if [ -z "$generated_xml" ]; then
              echo "No generated addon.xml found" >&2
              exit 1
            fi
            cp "$generated_xml" package-root/visualization.projectm/addon.xml
          fi

          cp "${{ steps.built.outputs.lib }}" package-root/visualization.projectm/libvisualization.projectm.so

          python3 - <<'PY'
          from pathlib import Path
          p = Path("package-root/visualization.projectm/addon.xml")
          s = p.read_text(encoding="utf-8-sig")
          if 'version="21.0.3.2"' not in s:
              s = s.replace('version="21.0.3"', 'version="21.0.3.2"', 1)
          if 'version="21.0.3.2"' not in s:
              raise SystemExit("Expected addon version not found")
          p.write_text(s, encoding="utf-8")
          PY

          (cd package-root && zip -qr ../out/visualization.projectm-21.0.3.2-omega-android-aarch64.zip visualization.projectm)
          sha256sum out/visualization.projectm-21.0.3.2-omega-android-aarch64.zip | tee out/SHA256SUMS.txt

      - name: Validate packaged addon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf validate
          mkdir validate
          unzip -q out/visualization.projectm-21.0.3.2-omega-android-aarch64.zip -d validate
          test -f validate/visualization.projectm/addon.xml
          test -f validate/visualization.projectm/libvisualization.projectm.so
          grep -F 'version="21.0.3.2"' validate/visualization.projectm/addon.xml
          grep -F '<platform>android-aarch64</platform>' validate/visualization.projectm/addon.xml
          file validate/visualization.projectm/libvisualization.projectm.so
          readelf -h validate/visualization.projectm/libvisualization.projectm.so | grep -E 'Class:|Machine:'
          readelf -d validate/visualization.projectm/libvisualization.projectm.so | grep 'libGLESv2.so'

      - name: Upload installable Kodi addon
        uses: actions/upload-artifact@v4
        with:
          name: visualization.projectm-21.0.3.2-omega-android-aarch64
          path: |
            out/visualization.projectm-21.0.3.2-omega-android-aarch64.zip
            out/SHA256SUMS.txt
          if-no-files-found: error
