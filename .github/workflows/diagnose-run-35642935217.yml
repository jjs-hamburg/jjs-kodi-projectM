name: Diagnose LibreELEC run 35642935217

on:
  push:
    branches:
      - diagnostic/run-35642935217
    paths:
      - ".github/workflows/diagnose-run-35642935217.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Extract first real failure from existing job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "106476381401"
        run: |
          set -euo pipefail

          log="$RUNNER_TEMP/job-${JOB_ID}.log"
          curl --fail --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
            -o "$log"

          echo "Downloaded log bytes: $(wc -c < "$log")"

          python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()

          fail_patterns = [
              re.compile(r"\[[0-9]+/[0-9]+\] \[FAIL\] build"),
              re.compile(r"FAILURE: scripts/build"),
              re.compile(r"\*\*\* FAILED COMMAND \*\*\*"),
          ]

          hits = []
          for i, line in enumerate(lines):
              if any(p.search(line) for p in fail_patterns):
                  hits.append(i)

          if not hits:
              print("NO FAILURE MARKER FOUND")
              sys.exit(1)

          first = hits[0]
          print(f"FIRST FAILURE MARKER LINE: {first + 1}")
          print("===== FAILURE CONTEXT =====")
          for n in range(max(0, first - 180), min(len(lines), first + 320)):
              print(f"{n + 1}: {lines[n]}")

          print("===== ERROR-LIKE LINES NEAR FAILURE =====")
          err = re.compile(r"(error:|fatal:|configure: error|CMake Error|undefined reference|No such file or directory|not supported|FAILED COMMAND|\[FAIL\]|FAILURE: scripts/build)", re.I)
          for n in range(max(0, first - 3000), min(len(lines), first + 1000)):
              if err.search(lines[n]):
                  print(f"{n + 1}: {lines[n]}")

          print("===== FIRST 40 FAILURE MARKERS =====")
          for i in hits[:40]:
              print(f"{i + 1}: {lines[i]}")
          PY
