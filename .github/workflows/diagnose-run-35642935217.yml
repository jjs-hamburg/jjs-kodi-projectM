name: Verify LibreELEC local file source semantics

on:
  push:
    branches:
      - diagnostic/run-35642935217
    paths:
      - ".github/workflows/diagnose-run-35642935217.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout exact LibreELEC 12.0.2
        uses: actions/checkout@v5
        with:
          repository: LibreELEC/LibreELEC.tv
          ref: f3fdd11916f8a47dc5a11c3a4c99cb7c7ffac78b
          path: LibreELEC.tv
          fetch-depth: 1

      - name: Verify file source get and extract
        shell: bash
        env:
          PROJECT: Generic
          DEVICE: Generic
          ARCH: x86_64
        run: |
          set -euo pipefail

          mkdir -p LibreELEC.tv/sources/visualization.projectm
          tmp="$RUNNER_TEMP/source-root"
          rm -rf "$tmp"
          mkdir -p "$tmp/visualization.projectm-21.0.3.3"
          printf '%s\n' 'local-source-probe' > "$tmp/visualization.projectm-21.0.3.3/probe.txt"
          tar -C "$tmp" -czf             LibreELEC.tv/sources/visualization.projectm/visualization.projectm-21.0.3.3.tar.gz             visualization.projectm-21.0.3.3

          python3 - <<'PY'
          from pathlib import Path

          p = Path("LibreELEC.tv/packages/mediacenter/kodi-binary-addons/visualization.projectm/package.mk")
          s = p.read_text(encoding="utf-8")
          replacements = [
              ('PKG_VERSION="21.0.3-Omega"', 'PKG_VERSION="21.0.3.3"'),
              ('PKG_URL="https://github.com/xbmc/visualization.projectm/archive/${PKG_VERSION}.tar.gz"',
               'PKG_URL="file://${SOURCES}/${PKG_NAME}/visualization.projectm-${PKG_VERSION}.tar.gz"'),
          ]
          for old, new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f"Expected exactly one recipe match: {old!r}")
              s = s.replace(old, new, 1)
          p.write_text(s, encoding="utf-8")

          p = Path("LibreELEC.tv/distributions/LibreELEC/options")
          s = p.read_text(encoding="utf-8")
          old = '  GET_HANDLER_SUPPORT="archive"'
          new = '  GET_HANDLER_SUPPORT="archive file"'
          if s.count(old) != 1:
              raise SystemExit("Expected exactly one GET_HANDLER_SUPPORT match")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

          cd LibreELEC.tv

          scripts/get visualization.projectm

          (
            . config/options visualization.projectm
            echo "Resolved PKG_URL=$PKG_URL"
            echo "Resolved PKG_SOURCE_NAME=$PKG_SOURCE_NAME"
            test "$PKG_SOURCE_NAME" = "$PWD/sources/visualization.projectm/visualization.projectm-21.0.3.3.tar.gz"
          )

          out="$RUNNER_TEMP/extract"
          rm -rf "$out"
          mkdir -p "$out"
          scripts/extract visualization.projectm "$out"
          test -f "$out/visualization.projectm-21.0.3.3/probe.txt"
          grep -F 'local-source-probe' "$out/visualization.projectm-21.0.3.3/probe.txt"

          echo "LibreELEC file:// source get/extract semantics verified."
