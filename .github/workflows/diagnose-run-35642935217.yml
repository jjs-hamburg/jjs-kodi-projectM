name: Diagnose LibreELEC run 35642935217

on:
  push:
    branches:
      - diagnose-run-35642935217
    paths:
      - ".github/workflows/diagnose-run-35642935217.yml"

permissions:
  actions: read
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-22.04
    steps:
      - name: Extract first real failure from existing job log
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: "106476381401"
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/job-${JOB_ID}.log"
          curl --fail --location             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs"             -o "$log"

          echo "Downloaded log bytes: $(wc -c < "$log")"

          python3 - "$log" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()

          fail_patterns = [
              re.compile(r"\[FAIL\]"),
              re.compile(r"FAILURE \[build"),
              re.compile(r"\*\*\* FAILED COMMAND \*\*\*"),
          ]
          error_patterns = [
              re.compile(r"\berror:", re.I),
              re.compile(r"fatal:", re.I),
              re.compile(r"CMake Error", re.I),
              re.compile(r"undefined reference", re.I),
              re.compile(r"No such file or directory", re.I),
              re.compile(r"not found", re.I),
              re.compile(r"ninja: build stopped", re.I),
              re.compile(r"make(?:\[[0-9]+\])?: \*\*\*", re.I),
              re.compile(r"configure: error", re.I),
              re.compile(r"FAILED:", re.I),
          ]

          fail_hits = [i for i, line in enumerate(lines) if any(p.search(line) for p in fail_patterns)]
          if not fail_hits:
              print("NO FAILURE MARKER FOUND")
              sys.exit(1)

          first = fail_hits[0]
          print(f"FIRST FAILURE MARKER LINE: {first + 1}")
          print("===== FIRST FAILURE CONTEXT =====")
          for n in range(max(0, first - 220), min(len(lines), first + 320)):
              print(f"{n + 1}: {lines[n]}")

          prior_error_hits = [
              i for i in range(0, first)
              if any(p.search(lines[i]) for p in error_patterns)
          ]
          print("===== LAST 120 ERROR-LIKE LINES BEFORE FIRST FAILURE =====")
          for i in prior_error_hits[-120:]:
              print(f"{i + 1}: {lines[i]}")

          print("===== FIRST 40 FAILURE MARKERS =====")
          for i in fail_hits[:40]:
              print(f"{i + 1}: {lines[i]}")
          PY
