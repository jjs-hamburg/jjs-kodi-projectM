name: Remove superseded projectM platform releases

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/delete-old-projectm-releases.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-22.04
    steps:
      - name: Remove superseded releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete v21.0.3.3-jjs-libreelec-x86_64 --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
          gh release delete v21.0.3.3-jjs-libreelec-rpi4-aarch64 --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
