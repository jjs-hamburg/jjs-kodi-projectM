name: Split Android and LibreELEC releases

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/migrate-split-projectm-releases.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-22.04
    steps:
      - name: Split existing release assets and metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ANDROID_TAG: v21.0.3.3-jjs
          LIBREELEC_TAG: v21.0.3.3-jjs-libreelec-x86_64
        run: |
          set -euo pipefail

          mkdir -p migration

          le_assets=(
            "visualization.projectm-21.0.3.3-omega-libreelec-x86_64.zip"
            "jjs-kodi-projectm-21.0.3.3-libreelec-x86_64-source.zip"
            "SHA256SUMS-libreelec-x86_64.txt"
          )

          android_assets=(
            "visualization.projectm-21.0.3.3-omega-android-aarch64.zip"
            "jjs-kodi-projectm-21.0.3.3-source.zip"
            "SHA256SUMS.txt"
          )

          for asset in "${le_assets[@]}"; do
            gh release download "${ANDROID_TAG}"               --repo "${GITHUB_REPOSITORY}"               --dir migration               --pattern "${asset}"
            test -s "migration/${asset}"
          done

          cat > android-notes.md <<'EOF'
          JJS KODI projectM stability build for Kodi 21/Omega on Android AArch64.

          The add-on ID remains `visualization.projectm`. The visible add-on name is **JJS KODI projectM**.

          This build changes the Kodi `visualization.projectm` wrapper so the audio callback never waits for projectM rendering or preset setup: mutex acquisition in `CVisualizationProjectM::AudioData()` is non-blocking, and the visualization yields immediately when projectM is busy.

          The functional fix was tested on NVIDIA Shield / Kodi 21 Omega and eliminated the audible dropouts that had occurred with some preset changes.

          This is an unofficial community build and is not an official release of Team Kodi, the Kodi Foundation, projectM, or their maintainers.

          **Assets**
          - `visualization.projectm-21.0.3.3-omega-android-aarch64.zip` — installable Kodi add-on
          - `jjs-kodi-projectm-21.0.3.3-source.zip` — corresponding source
          - `SHA256SUMS.txt` — checksums

          Exact upstream revisions, source transformation, licensing, and reproducibility details are documented in the repository README and SOURCE.md.
          EOF

          cat > libreelec-notes.md <<'EOF'
          JJS KODI projectM stability build for **LibreELEC 12.0.2 Generic x86_64** with Kodi 21/Omega.

          The add-on ID remains `visualization.projectm`. The visible add-on name is **JJS KODI projectM**.

          This build uses the same JJS audio-isolation source change as the Android build: mutex acquisition in `CVisualizationProjectM::AudioData()` is non-blocking, so projectM rendering or preset setup cannot stall Kodi's audio callback.

          The LibreELEC package was built with the pinned LibreELEC 12.0.2 Generic x86_64 environment, validated as an x86-64 ELF Kodi binary add-on, and successfully installed and run on a real LibreELEC 12.0.2 x86_64 system.

          This is an unofficial community build and is not an official release of Team Kodi, the Kodi Foundation, LibreELEC, projectM, or their maintainers.

          **Assets**
          - `visualization.projectm-21.0.3.3-omega-libreelec-x86_64.zip` — installable Kodi add-on
          - `jjs-kodi-projectm-21.0.3.3-libreelec-x86_64-source.zip` — corresponding source including the exact LibreELEC package recipe
          - `SHA256SUMS-libreelec-x86_64.txt` — checksums

          Exact upstream revisions, source transformation, licensing, and reproducibility details are documented in the repository README and SOURCE.md.
          EOF

          if gh release view "${LIBREELEC_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${LIBREELEC_TAG}"               --repo "${GITHUB_REPOSITORY}"               --title "JJS KODI projectM 21.0.3.3 — LibreELEC 12.0.2 Generic x86_64"               --notes-file libreelec-notes.md
          else
            gh release create "${LIBREELEC_TAG}"               --repo "${GITHUB_REPOSITORY}"               --target "${GITHUB_SHA}"               --title "JJS KODI projectM 21.0.3.3 — LibreELEC 12.0.2 Generic x86_64"               --notes-file libreelec-notes.md
          fi

          gh release upload "${LIBREELEC_TAG}"             --repo "${GITHUB_REPOSITORY}"             "migration/${le_assets[0]}"             "migration/${le_assets[1]}"             "migration/${le_assets[2]}"             --clobber

          for asset in "${le_assets[@]}"; do
            gh release view "${LIBREELEC_TAG}"               --repo "${GITHUB_REPOSITORY}"               --json assets               --jq '.assets[].name' | grep -Fx "${asset}"
          done

          gh release edit "${ANDROID_TAG}"             --repo "${GITHUB_REPOSITORY}"             --title "JJS KODI projectM 21.0.3.3 — Kodi 21/Omega Android AArch64"             --notes-file android-notes.md

          for asset in "${le_assets[@]}"; do
            gh release delete-asset "${ANDROID_TAG}" "${asset}"               --repo "${GITHUB_REPOSITORY}"               --yes
          done

          for asset in "${android_assets[@]}"; do
            gh release view "${ANDROID_TAG}"               --repo "${GITHUB_REPOSITORY}"               --json assets               --jq '.assets[].name' | grep -Fx "${asset}"
          done

          test "$(gh release view "${ANDROID_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')" = "3"
          test "$(gh release view "${LIBREELEC_TAG}" --repo "${GITHUB_REPOSITORY}" --json assets --jq '.assets | length')" = "3"
